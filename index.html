<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devartsx - Anime Custom Art & Orders</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Ambient glowing background orbs */
        .ambient-orb {
            position: absolute;
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.5;
            animation: floatOrb 8s ease-in-out infinite alternate;
        }

        .orb-1 { top: -50px; left: -50px; }
        .orb-2 { bottom: -50px; right: -50px; background: linear-gradient(135deg, #0070f3, #7928ca); }

        @keyframes floatOrb {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* Logo & Header Section */
        .brand-logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 10px auto;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        header p {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* Portfolio Showcase Section */
        .portfolio-section {
            margin-bottom: 20px;
            text-align: left;
        }

        .section-title {
            font-size: 0.85rem;
            color: #d1d5db;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .art-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .art-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .art-card:hover {
            border-color: rgba(255, 0, 127, 0.5);
            background: rgba(255, 255, 255, 0.06);
        }

        .art-thumb {
            width: 100%;
            height: 60px;
            border-radius: 8px;
            background: linear-gradient(135deg, #1f2937, #111827);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .art-name {
            font-size: 0.75rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .art-tag {
            font-size: 0.65rem;
            color: #ff7eb3;
        }

        .preview-box {
            width: 100%;
            height: 200px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            position: relative;
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .preview-box .placeholder-text {
            color: #9ca3af;
            font-size: 0.85rem;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #d1d5db;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #ff007f;
        }

        input[type="file"] {
            padding: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        textarea {
            resize: none;
            height: 75px;
        }

        .btn-order {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            margin-top: 5px;
        }

        .btn-order:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .loading {
            display: none;
            font-size: 0.85rem;
            color: #ff7eb3;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="container" id="mainContainer">
        <header>
            <div class="brand-logo">DX</div>
            <h1>Devartsx</h1>
            <p>Custom Anime Art & Orders</p>
        </header>

        <!-- Portfolio Showcase Section -->
        <div class="portfolio-section">
            <div class="section-title">
                <span>Featured Artworks</span>
                <span style="font-size: 0.7rem; color: #9ca3af;">Portfolio Gallery</span>
            </div>
            <div class="art-grid">
                <div class="art-card">
                    <div class="art-thumb">Art 1</div>
                    <div class="art-name">Cyber Samurai</div>
                    <div class="art-tag">Concept</div>
                </div>
                <div class="art-card">
                    <div class="art-thumb">Art 2</div>
                    <div class="art-name">Neon Demon</div>
                    <div class="art-tag">Illustration</div>
                </div>
                <div class="art-card">
                    <div class="art-thumb">Art 3</div>
                    <div class="art-name">Chibi Hero</div>
                    <div class="art-tag">Portrait</div>
                </div>
            </div>
        </div>

        <div class="preview-box">
            <span class="placeholder-text" id="placeholderText">Image Preview Will Appear Here</span>
            <img id="imagePreview" alt="Uploaded Preview">
        </div>

        <form id="orderForm">
            <div class="form-group">
                <label for="customerName">Your Name</label>
                <input type="text" id="customerName" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="artworkImage">Upload Reference Image</label>
                <input type="file" id="artworkImage" accept="image/*" required>
            </div>

            <div class="form-group">
                <label for="instructions">Custom Instructions / Details</label>
                <textarea id="instructions" placeholder="Describe what you want (e.g., character, pose, size)"></textarea>
            </div>

            <div class="loading" id="loadingText">Uploading image & opening WhatsApp...</div>

            <button type="submit" class="btn-order">Order Now via WhatsApp</button>
        </form>
    </div>

    <script>
        // Image Preview Handler
        const imageInput = document.getElementById('artworkImage');
        const imagePreview = document.getElementById('imagePreview');
        const placeholderText = document.getElementById('placeholderText');

        imageInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                    placeholderText.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        // Form Submission & WhatsApp Handler
        const orderForm = document.getElementById('orderForm');
        const loadingText = document.getElementById('loadingText');

        orderForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('customerName').value;
            const instructions = document.getElementById('instructions').value;
            const fileField = document.getElementById('artworkImage').files[0];

            loadingText.style.display = 'block';

            let imageUrlText = "No image uploaded";

            if (fileField) {
                const formData = new FormData();
                formData.append("image", fileField);

                try {
                    const response = await fetch('https://api.imgbb.com/1/upload?key=6d207e02198a847aa98d0a2a901485a5', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    if (data && data.success) {
                        imageUrlText = data.data.url;
                    } else {
                        imageUrlText = "Image upload failed via API";
                    }
                } catch (error) {
                    console.error("Image upload failed:", error);
                    imageUrlText = "Image upload failed, user will send manually.";
                }
            }

            loadingText.style.display = 'none';

            // WhatsApp Number set to 7827417956
            const whatsappNumber = "917827417956"; 
            const message = `*New Order Request - Devartsx*\n\n*Name:* ${name}\n*Instructions:* ${instructions || 'None'}\n*Reference Image:* ${imageUrlText}`;
            
            const encodedMessage = encodeURIComponent(message);
            
            // Open WhatsApp Directly
            window.open(`https://wa.me/${whatsappNumber}?text=${encodedMessage}`, '_blank');
        });
    </script>
</body>
</html>
